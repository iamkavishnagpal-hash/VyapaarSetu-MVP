<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <rect width="900" height="400" fill="#0f172a" rx="16"/>
  <text x="40" y="45" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="700">Database Entity Relationship Diagram (ERD Schema)</text>

  <g transform="translate(50, 90)">
    <rect width="180" height="120" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#6366f1" font-weight="700" font-family="system-ui">vendors</text>
    <text x="15" y="55" fill="#94a3b8" font-size="12" font-family="system-ui">PK vendor_id</text>
    <text x="15" y="75" fill="#94a3b8" font-size="12" font-family="system-ui">vendor_name</text>
    <text x="15" y="95" fill="#94a3b8" font-size="12" font-family="system-ui">sla_compliance_pct</text>
  </g>

  <g transform="translate(350, 90)">
    <rect width="180" height="120" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#10b981" font-weight="700" font-family="system-ui">products</text>
    <text x="15" y="55" fill="#94a3b8" font-size="12" font-family="system-ui">PK product_id</text>
    <text x="15" y="75" fill="#94a3b8" font-size="12" font-family="system-ui">FK vendor_id</text>
    <text x="15" y="95" fill="#94a3b8" font-size="12" font-family="system-ui">cogs_inr | msrp_inr</text>
  </g>

  <g transform="translate(650, 90)">
    <rect width="180" height="120" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#f59e0b" font-weight="700" font-family="system-ui">orders</text>
    <text x="15" y="55" fill="#94a3b8" font-size="12" font-family="system-ui">PK order_id</text>
    <text x="15" y="75" fill="#94a3b8" font-size="12" font-family="system-ui">FK store_id | customer_id</text>
    <text x="15" y="95" fill="#94a3b8" font-size="12" font-family="system-ui">total_amount_inr</text>
  </g>

  <g transform="translate(350, 250)">
    <rect width="180" height="120" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#ef4444" font-weight="700" font-family="system-ui">escrow_transactions</text>
    <text x="15" y="55" fill="#94a3b8" font-size="12" font-family="system-ui">PK escrow_id</text>
    <text x="15" y="75" fill="#94a3b8" font-size="12" font-family="system-ui">FK order_id</text>
    <text x="15" y="95" fill="#94a3b8" font-size="12" font-family="system-ui">status | amount_inr</text>
  </g>

  <!-- Connectors -->
  <path d="M230,150 L350,150" stroke="#94a3b8" stroke-width="2"/>
  <path d="M530,150 L650,150" stroke="#94a3b8" stroke-width="2"/>
  <path d="M740,210 L740,310 L530,310" fill="none" stroke="#94a3b8" stroke-width="2"/>
</svg>
