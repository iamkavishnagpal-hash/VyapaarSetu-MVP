    <rect width="160" height="100" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="15" y="35" fill="#f59e0b" font-size="12" font-weight="700" font-family="system-ui">3. Escrow Lock</text>
