<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <rect width="900" height="220" fill="#0f172a" rx="16"/>
  <text x="40" y="35" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="700">Merchant User Journey Map & Emotional Trajectory</text>

