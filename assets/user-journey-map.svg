    <text x="0" y="15" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui">Discovery</text>
    <text x="0" y="90" fill="#10b981" font-size="11" text-anchor="middle" font-family="system-ui">Optimistic</text>
  </g>

  <g transform="translate(265, 70)">
    <circle cx="0" cy="50" r="16" fill="#6366f1"/>
    <text x="0" y="55" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">2</text>
    <text x="0" y="15" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui">GSTIN KYC</text>
    <text x="0" y="90" fill="#10b981" font-size="11" text-anchor="middle" font-family="system-ui">Reassured</text>
  </g>

  <g transform="translate(450, 70)">
    <circle cx="0" cy="50" r="16" fill="#6366f1"/>
    <text x="0" y="55" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">3</text>
    <text x="0" y="15" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui">Stock Sync</text>
    <text x="0" y="90" fill="#10b981" font-size="11" text-anchor="middle" font-family="system-ui">Empowered</text>
  </g>

  <g transform="translate(635, 70)">
    <circle cx="0" cy="50" r="16" fill="#6366f1"/>
    <text x="0" y="55" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">4</text>
    <text x="0" y="15" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui">Escrow Order</text>
    <text x="0" y="90" fill="#10b981" font-size="11" text-anchor="middle" font-family="system-ui">Confident</text>
