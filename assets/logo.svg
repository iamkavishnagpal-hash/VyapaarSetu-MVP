  <!-- Top Node -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="50" cy="26" r="6.5" fill="#FFFFFF"/>
  <!-- Top-Right Node -->
  <line x1="50" y1="50" x2="71" y2="35" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="73" cy="33.5" r="6.5" fill="#FFFFFF"/>
  <!-- Bottom-Right Node -->
  <line x1="50" y1="50" x2="63" y2="69" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="65" cy="71.5" r="6.5" fill="#FFFFFF"/>
  <!-- Bottom-Left Node -->
  <line x1="50" y1="50" x2="37" y2="69" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="35" cy="71.5" r="6.5" fill="#FFFFFF"/>
  <!-- Top-Left Node -->
  <line x1="50" y1="50" x2="29" y2="35" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="27" cy="33.5" r="6.5" fill="#FFFFFF"/>
</svg>
