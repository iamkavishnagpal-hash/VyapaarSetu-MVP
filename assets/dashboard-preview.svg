<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <rect width="1000" height="400" fill="#0f172a" rx="16"/>
  <rect x="2" y="2" width="996" height="396" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="14"/>

  <text x="30" y="40" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="700">Power BI 8-Tab Executive Dashboard Preview</text>

  <!-- 4 Cards Top -->
  <g transform="translate(30, 60)">
    <rect width="215" height="70" fill="#1e293b" rx="8"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-family="system-ui">GROSS GMV</text>
    <text x="15" y="52" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui">₹ 48.5M</text>
  </g>
  <g transform="translate(265, 60)">
    <rect width="215" height="70" fill="#1e293b" rx="8"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-family="system-ui">GROSS MARGIN %</text>
    <text x="15" y="52" fill="#10b981" font-size="18" font-weight="700" font-family="system-ui">28.4%</text>
  </g>
  <g transform="translate(500, 60)">
    <rect width="215" height="70" fill="#1e293b" rx="8"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-family="system-ui">ACTIVE STORES</text>
    <text x="15" y="52" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui">50 Stores</text>
  </g>
  <g transform="translate(735, 60)">
    <rect width="235" height="70" fill="#1e293b" rx="8"/>
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-family="system-ui">ESCROW VAULT</text>
    <text x="15" y="52" fill="#6366f1" font-size="18" font-weight="700" font-family="system-ui">₹ 14.2M Locked</text>
  </g>

  <!-- Left Main Chart -->
  <g transform="translate(30, 150)">
    <rect width="570" height="220" fill="#1e293b" rx="8"/>
    <text x="20" y="30" fill="#ffffff" font-size="14" font-weight="600" font-family="system-ui">Monthly GMV vs Margin % Trajectory</text>
    <path d="M20,180 Q150,60 300,120 T540,50" fill="none" stroke="#6366f1" stroke-width="3"/>
    <path d="M20,190 Q150,110 300,140 T540,90" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  </g>

  <!-- Right Donut Chart -->
  <g transform="translate(620, 150)">
    <rect width="350" height="220" fill="#1e293b" rx="8"/>
    <text x="20" y="30" fill="#ffffff" font-size="14" font-weight="600" font-family="system-ui">Store Tier Revenue Share</text>
    <circle cx="175" cy="130" r="60" fill="none" stroke="#6366f1" stroke-width="20"/>
    <circle cx="175" cy="130" r="60" fill="none" stroke="#10b981" stroke-width="20" stroke-dasharray="100 200"/>
  </g>
</svg>
