<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <rect width="1000" height="300" fill="#0f172a" rx="16"/>
  <text x="30" y="40" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="700">UX Wireframe Screen Layout Preview</text>

  <!-- Sidebar Wireframe -->
  <g transform="translate(30, 60)">
    <rect width="180" height="210" fill="#1e293b" stroke="rgba(255,255,255,0.1)" rx="8"/>
    <text x="15" y="30" fill="#6366f1" font-size="12" font-weight="700" font-family="system-ui">Navigation</text>
    <rect x="15" y="45" width="150" height="20" fill="rgba(99,102,241,0.3)" rx="4"/>
    <rect x="15" y="75" width="150" height="20" fill="rgba(255,255,255,0.05)" rx="4"/>
    <rect x="15" y="105" width="150" height="20" fill="rgba(255,255,255,0.05)" rx="4"/>
    <rect x="15" y="135" width="150" height="20" fill="rgba(255,255,255,0.05)" rx="4"/>
  </g>

  <!-- Header & Grid Wireframe -->
  <g transform="translate(230, 60)">
    <rect width="740" height="40" fill="#1e293b" rx="8"/>
    <text x="20" y="25" fill="#ffffff" font-size="13" font-family="system-ui">Executive Command Center (Live Filter Bar)</text>

    <rect y="55" width="230" height="155" fill="#1e293b" rx="8"/>
    <text x="15" y="30" fill="#94a3b8" font-size="11" font-family="system-ui">Inventory Command Table</text>

    <rect x="250" y="55" width="230" height="155" fill="#1e293b" rx="8"/>
    <text x="15" y="30" fill="#94a3b8" font-size="11" font-family="system-ui">Escrow Vault Milestone</text>

    <rect x="500" y="55" width="240" height="155" fill="#1e293b" rx="8"/>
    <text x="15" y="30" fill="#94a3b8" font-size="11" font-family="system-ui">M&A Store Listing Cards</text>
  </g>
</svg>
